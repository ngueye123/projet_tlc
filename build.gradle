plugins {
    id 'java'
    id 'antlr'
}

repositories {
    mavenCentral()
}

dependencies {
    antlr 'org.antlr:antlr:3.5.2'
    implementation 'org.antlr:antlr-runtime:3.5.2'
}

generateGrammarSource {
    maxHeapSize = "64m"
}

sourceSets {
    test {
        java {
            srcDirs = ['src/test']
        }
    }
}

tasks.register('runAstTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'tlc.whilecompiler.ast.AstTest'
}